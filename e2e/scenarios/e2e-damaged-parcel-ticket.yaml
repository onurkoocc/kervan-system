id: e2e-damaged-parcel-ticket
description: >-
  A damaged parcel: open_ticket through mcp creates a DAMAGED ticket in core, and the reply
  carries the ticket id core assigned.
turns:
  - My parcel KRV10000103 arrived damaged. The box was crushed.
expect:
  tool_calls:
    - name: open_ticket
      arguments:
        tracking_no: KRV10000103
        category: DAMAGED
  reply_contains:
    - TCK-
    - KRV10000103
  forbidden_tools: [reschedule_delivery]
  final_state: done
